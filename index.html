<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cozmos Kingdom</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-wrap">
    <h1 id="title-banner">COZMOS KINGDOM</h1>
    <canvas id="game" width="512" height="288" tabindex="0"></canvas>
    <div id="hint">Click/tap the screen to play &nbsp;|&nbsp; Arrows/WASD or the buttons below to move &nbsp;|&nbsp; M to toggle music</div>

    <div id="touch-controls">
      <div class="touch-row">
        <button id="btn-left" class="touch-btn">◀</button>
        <button id="btn-right" class="touch-btn">▶</button>
      </div>
      <button id="btn-jump" class="touch-btn touch-jump">JUMP</button>
      <button id="btn-pause" class="touch-btn">⏸</button>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
